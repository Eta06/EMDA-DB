[package]
name = "database-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
rustix = { version = "1.1", features = ["fs"] }
database-engine = { path = ".." }
libfuzzer-sys = "0.4"
