[package]
name = "database-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
rustix = { version = "1.1", features = ["fs"] }
database-engine = { path = ".." }
libfuzzer-sys = "0.4"
sha2 = "0.10"
tempfile = "3.20"

[[bin]]
name = "recovery"
path = "fuzz_targets/recovery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoint"
path = "fuzz_targets/checkpoint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoint_order"
path = "fuzz_targets/checkpoint_order.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transaction_read_set"
path = "fuzz_targets/transaction_read_set.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_byte_limit"
path = "fuzz_targets/key_byte_limit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log_limit"
path = "fuzz_targets/log_limit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recovered_view_order"
path = "fuzz_targets/recovered_view_order.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
