[package]
name = "database-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[dependencies]
crc32fast = "1.5"
fs2 = "0.4"
parking_lot = "0.12.5"
rustix = { version = "1.1", features = ["fs"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"

[dev-dependencies]
rusqlite = { version = "0.35", features = ["bundled"] }
rustix = { version = "1.1", features = ["process"] }
