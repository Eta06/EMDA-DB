name: Recovery fuzzing

"on":
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  recovery:
    name: Recovery parser and fail-closed behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install nightly Rust
        run: rustup toolchain install nightly-2026-11-03 --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-11-03 install cargo-fuzz --version 0.13.2 --locked
      - name: Run coverage-guided recovery fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-corpus"
          cp fuzz/seeds/* "$RUNNER_TEMP/recovery-corpus/"
          cargo +nightly-2026-11-03 fuzz run recovery "$RUNNER_TEMP/recovery-corpus" -- -max_total_time=60 -max_len=8192 -timeout=10
      - name: Run checkpoint parser fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoint-corpus"
          cp fuzz/checkpoint-seeds/* "$RUNNER_TEMP/checkpoint-corpus/"
          cargo +nightly-2026-11-03 fuzz run checkpoint "$RUNNER_TEMP/checkpoint-corpus" -- -max_total_time=60 -max_len=8192 -timeout=10
      - name: Run checkpoint index ordering fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoint-order-corpus"
          cp fuzz/checkpoint-order-seeds/* "$RUNNER_TEMP/checkpoint-order-corpus/"
          cargo +nightly-2026-11-03 fuzz run checkpoint_order "$RUNNER_TEMP/checkpoint-order-corpus" -- -max_total_time=60 -max_len=1025 -timeout=10
      - name: Run read-set transaction model fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/transaction-read-set-corpus"
          cp fuzz/transaction-read-set-seeds/* "$RUNNER_TEMP/transaction-read-set-corpus/"
          cargo +nightly-2026-11-03 fuzz run transaction_read_set "$RUNNER_TEMP/transaction-read-set-corpus" -- -max_total_time=60 -max_len=256 -timeout=10
      - name: Run live-key byte limit model fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/key-byte-limit-corpus"
          cp fuzz/key-byte-limit-seeds/* "$RUNNER_TEMP/key-byte-limit-corpus/"
          cargo +nightly-2026-11-03 fuzz run key_byte_limit "$RUNNER_TEMP/key-byte-limit-corpus" -- -max_total_time=60 -max_len=128 -timeout=10
      - name: Run log limit model fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/log-limit-corpus"
          cp fuzz/log-limit-seeds/* "$RUNNER_TEMP/log-limit-corpus/"
          cargo +nightly-2026-11-03 fuzz run log_limit "$RUNNER_TEMP/log-limit-corpus" -- -max_total_time=60 -max_len=128 -timeout=10
      - name: Run recovered checkpoint ordering fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/recovered-view-order-corpus"
          cp fuzz/checkpoint-order-seeds/* "$RUNNER_TEMP/recovered-view-order-corpus/"
          cargo +nightly-2026-11-03 fuzz run recovered_view_order "$RUNNER_TEMP/recovered-view-order-corpus" -- -max_total_time=60 -max_len=1025 -timeout=10
      - name: Run writable checkpoint model fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoint-store-corpus"
          cp fuzz/checkpoint-store-seeds/* "$RUNNER_TEMP/checkpoint-store-corpus/"
          cargo +nightly-2026-11-03 fuzz run checkpoint_store "$RUNNER_TEMP/checkpoint-store-corpus" -- -max_total_time=60 -max_len=128 -timeout=10
      - name: Run checkpoint point read-set model fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoint-read-set-corpus"
          cp fuzz/checkpoint-read-set-seeds/* "$RUNNER_TEMP/checkpoint-read-set-corpus/"
          cargo +nightly-2026-11-03 fuzz run checkpoint_read_set "$RUNNER_TEMP/checkpoint-read-set-corpus" -- -max_total_time=60 -max_len=256 -timeout=10
      - name: Run writable checkpoint recovery fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoint-recovery-corpus"
          cp fuzz/checkpoint-recovery-seeds/* "$RUNNER_TEMP/checkpoint-recovery-corpus/"
          cargo +nightly-2026-11-03 fuzz run checkpoint_recovery "$RUNNER_TEMP/checkpoint-recovery-corpus" -- -max_total_time=60 -max_len=256 -timeout=10
      - name: Run streamed backup restore fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/backup-restore-corpus"
          cp fuzz/backup-restore-seeds/* "$RUNNER_TEMP/backup-restore-corpus/"
          cargo +nightly-2026-11-03 fuzz run backup_restore "$RUNNER_TEMP/backup-restore-corpus" -- -max_total_time=60 -max_len=256 -timeout=10
      - name: Run managed checkpoint model fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/managed-checkpoint-corpus"
          cp fuzz/managed-checkpoint-seeds/* "$RUNNER_TEMP/managed-checkpoint-corpus/"
          cargo +nightly-2026-11-03 fuzz run managed_checkpoint "$RUNNER_TEMP/managed-checkpoint-corpus" -- -max_total_time=60 -max_len=128 -timeout=10
      - name: Run automatic checkpoint model fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/automatic-checkpoint-corpus"
          cp fuzz/automatic-checkpoint-seeds/* "$RUNNER_TEMP/automatic-checkpoint-corpus/"
          cargo +nightly-2026-11-03 fuzz run automatic_checkpoint "$RUNNER_TEMP/automatic-checkpoint-corpus" -- -max_total_time=60 -max_len=128 -timeout=10
      - name: Run compacted-store exchange model fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/compact-exchange-corpus"
          cp fuzz/compact-exchange-seeds/* "$RUNNER_TEMP/compact-exchange-corpus/"
          cargo +nightly-2026-11-03 fuzz run compact_exchange "$RUNNER_TEMP/compact-exchange-corpus" -- -max_total_time=60 -max_len=96 -timeout=10
      - name: Run document transaction and index model fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/document-model-corpus"
          cp fuzz/document-model-seeds/* "$RUNNER_TEMP/document-model-corpus/"
          cargo +nightly-2026-11-03 fuzz run document_model "$RUNNER_TEMP/document-model-corpus" -- -max_total_time=60 -max_len=64 -timeout=10
      - name: Run checkpoint-store exchange model fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoint-exchange-corpus"
          cp fuzz/checkpoint-exchange-seeds/* "$RUNNER_TEMP/checkpoint-exchange-corpus/"
          cargo +nightly-2026-11-03 fuzz run checkpoint_exchange "$RUNNER_TEMP/checkpoint-exchange-corpus" -- -max_total_time=60 -max_len=64 -timeout=10
      - name: Preserve any reproducer
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-fuzz-reproducer
          path: fuzz/artifacts/
          if-no-files-found: ignore
