name: Recovery fuzzing

"on":
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  recovery:
    name: Recovery parser and fail-closed behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install nightly Rust
        run: rustup toolchain install nightly-2026-11-03 --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-11-03 install cargo-fuzz --version 0.13.2 --locked
      - name: Run coverage-guided recovery fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-corpus"
          cp fuzz/seeds/* "$RUNNER_TEMP/recovery-corpus/"
          cargo +nightly-2026-11-03 fuzz run recovery "$RUNNER_TEMP/recovery-corpus" -- -max_total_time=60 -max_len=8192 -timeout=10
      - name: Run checkpoint parser fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoint-corpus"
          cp fuzz/checkpoint-seeds/* "$RUNNER_TEMP/checkpoint-corpus/"
          cargo +nightly-2026-11-03 fuzz run checkpoint "$RUNNER_TEMP/checkpoint-corpus" -- -max_total_time=60 -max_len=8192 -timeout=10
      - name: Run checkpoint index ordering fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoint-order-corpus"
          cp fuzz/checkpoint-order-seeds/* "$RUNNER_TEMP/checkpoint-order-corpus/"
          cargo +nightly-2026-11-03 fuzz run checkpoint_order "$RUNNER_TEMP/checkpoint-order-corpus" -- -max_total_time=60 -max_len=1025 -timeout=10
      - name: Run read-set transaction model fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/transaction-read-set-corpus"
          cp fuzz/transaction-read-set-seeds/* "$RUNNER_TEMP/transaction-read-set-corpus/"
          cargo +nightly-2026-11-03 fuzz run transaction_read_set "$RUNNER_TEMP/transaction-read-set-corpus" -- -max_total_time=60 -max_len=256 -timeout=10
      - name: Run live-key byte limit model fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/key-byte-limit-corpus"
          cp fuzz/key-byte-limit-seeds/* "$RUNNER_TEMP/key-byte-limit-corpus/"
          cargo +nightly-2026-11-03 fuzz run key_byte_limit "$RUNNER_TEMP/key-byte-limit-corpus" -- -max_total_time=60 -max_len=128 -timeout=10
      - name: Run log limit model fuzzing
        run: |
          mkdir -p "$RUNNER_TEMP/log-limit-corpus"
          cp fuzz/log-limit-seeds/* "$RUNNER_TEMP/log-limit-corpus/"
          cargo +nightly-2026-11-03 fuzz run log_limit "$RUNNER_TEMP/log-limit-corpus" -- -max_total_time=60 -max_len=128 -timeout=10
      - name: Preserve any reproducer
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-fuzz-reproducer
          path: fuzz/artifacts/
          if-no-files-found: ignore
