name: Compound range cross-engine smoke
run-name: Compound range cross-engine ${{ inputs.comparison_scale || 'smoke' }}

"on":
  workflow_dispatch:
    inputs:
      comparison_scale:
        description: Comparison workload
        type: choice
        default: smoke
        options:
          - smoke
          - measured
  push:
    branches: [main]
    paths:
      - ".github/workflows/compound-range-smoke.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "examples/compound_range_query_bench.rs"
      - "examples/document_contention_bench.rs"
      - "examples/network_bench_server.rs"
      - "examples/index_memory_bench.rs"
      - "examples/sqlite_restart_write_bench.rs"
      - "scripts/large_crash_compare.py"
      - "scripts/compare_crashes.py"
      - "scripts/compound_range_external_compare.py"
      - "scripts/document_contention_compare.py"
      - "scripts/nonunique_query_compare.py"
      - "scripts/benchmark-requirements.txt"
      - "scripts/benchmarks/**"
      - "scripts/tests/test_compound_range_external_compare.py"
      - "scripts/tests/test_record_benchmark_case.py"
      - "scripts/tests/test_large_crash_compare.py"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/compound-range-smoke.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "examples/compound_range_query_bench.rs"
      - "examples/document_contention_bench.rs"
      - "examples/network_bench_server.rs"
      - "examples/index_memory_bench.rs"
      - "examples/sqlite_restart_write_bench.rs"
      - "scripts/large_crash_compare.py"
      - "scripts/compare_crashes.py"
      - "scripts/compound_range_external_compare.py"
      - "scripts/document_contention_compare.py"
      - "scripts/nonunique_query_compare.py"
      - "scripts/benchmark-requirements.txt"
      - "scripts/benchmarks/**"
      - "scripts/tests/test_compound_range_external_compare.py"
      - "scripts/tests/test_record_benchmark_case.py"
      - "scripts/tests/test_large_crash_compare.py"
      - "src/**"

permissions:
  contents: read

jobs:
  cross-engine:
    name: PostgreSQL, MongoDB and in-process adapters
    # MongoDB 8.0 rejects the 7.0.0 Azure kernel currently used by the 24.04
    # hosted image (SERVER-121912). Use the older hosted image while supported;
    # keep MongoDB's startup protection enabled and record the actual kernel.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install pinned benchmark drivers
        run: |
          python3 -m venv "$RUNNER_TEMP/benchmark-venv"
          python3 -c 'import os; from pathlib import Path; lines = [line for line in Path("scripts/benchmark-requirements.txt").read_text().splitlines() if line.startswith(("psycopg[binary]==", "pymongo=="))]; assert len(lines) == 2; Path(os.environ["RUNNER_TEMP"], "cross-engine-requirements.txt").write_text("\n".join(lines) + "\n")'
          "$RUNNER_TEMP/benchmark-venv/bin/python" -m pip install -r "$RUNNER_TEMP/cross-engine-requirements.txt"
      - name: Load pinned disposable-server images
        run: |
          docker pull postgres@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
          docker tag postgres@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8 postgres:18-bookworm
          docker pull mongo@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
          docker tag mongo@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142 mongo:8.0
          docker pull redis@sha256:99ffb973380cc2f47bca06bd094f7f8c7138a0879a63cb8939896a22b7a65bba
          docker tag redis@sha256:99ffb973380cc2f47bca06bd094f7f8c7138a0879a63cb8939896a22b7a65bba redis:8.2-bookworm
      - name: Build and run verified compound range comparison
        env:
          COMPARISON_SCALE: ${{ inputs.comparison_scale || 'smoke' }}
        run: |
          cargo +stable build --release --locked --example compound_range_query_bench
          cpu_pair="$(python3 -c 'import os; c=sorted(os.sched_getaffinity(0)); assert len(c) >= 2; print(c[0], c[1])')"
          read -r driver_cpu server_cpu <<< "$cpu_pair"
          workload=(--cases 16:4 --rounds 2 --cycles 2)
          if [[ "$COMPARISON_SCALE" == measured ]]; then
            workload=(--cases 100:10,1000:10,1000:100 --rounds 4 --cycles 50)
          fi
          driver="$RUNNER_TEMP/benchmark-venv/bin/python"
          range_case="$RUNNER_TEMP/compound-range-$COMPARISON_SCALE"
          "$driver" -m scripts.benchmarks.record_case \
            --directory "$range_case" --case "compound-range-$COMPARISON_SCALE" -- \
            "$driver" scripts/compound_range_external_compare.py \
            --directory "$RUNNER_TEMP" --binary target/release/examples/compound_range_query_bench \
            --output "$range_case/samples.json" "${workload[@]}" \
            --driver-cpus "$driver_cpu" --server-cpus "$server_cpu"
          cargo +stable build --release --locked --example network_bench_server --example index_memory_bench --example sqlite_restart_write_bench
          crash_case="$RUNNER_TEMP/large-crash-smoke"
          "$driver" -m scripts.benchmarks.record_case \
            --directory "$crash_case" --case large-crash-smoke -- \
            "$driver" scripts/large_crash_compare.py \
            --directory "$RUNNER_TEMP" --output "$crash_case/samples.json" \
            --keys 128 --client-cpus "$driver_cpu" --server-cpus "$server_cpu"
      - name: Preserve comparison report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compound-range-cross-engine-${{ inputs.comparison_scale || 'smoke' }}
          path: |
            ${{ runner.temp }}/compound-range-*/attempt.json
            ${{ runner.temp }}/compound-range-*/command.log
            ${{ runner.temp }}/compound-range-*/samples.json
            ${{ runner.temp }}/large-crash-smoke/
          if-no-files-found: ignore
      - name: Compare durable concurrent updates and indexed reads
        env:
          COMPARISON_SCALE: ${{ inputs.comparison_scale || 'smoke' }}
        run: |
          cargo +stable build --release --locked --example document_contention_bench
          cpu_pair="$(python3 -c 'import os; c=sorted(os.sched_getaffinity(0)); assert len(c) >= 2; n=len(c)//2; print(",".join(map(str,c[:n])), ",".join(map(str,c[n:2*n])))')"
          read -r driver_cpus server_cpus <<< "$cpu_pair"
          workload=(--clients 1,4 --rounds 2 --cycles 4 --documents 32)
          if [[ "$COMPARISON_SCALE" == measured ]]; then
            workload=(--clients 1,2,4,8 --rounds 5 --cycles 100 --documents 500)
          fi
          driver="$RUNNER_TEMP/benchmark-venv/bin/python"
          contention_case="$RUNNER_TEMP/document-contention-$COMPARISON_SCALE"
          "$driver" -m scripts.benchmarks.record_case \
            --directory "$contention_case" --case "document-contention-$COMPARISON_SCALE" -- \
            "$driver" scripts/document_contention_compare.py \
            --directory "$RUNNER_TEMP" --binary target/release/examples/document_contention_bench \
            --output "$contention_case/samples.json.gz" --source-revision "$GITHUB_SHA" \
            --driver-cpus "$driver_cpus" --server-cpus "$server_cpus" "${workload[@]}"
      - name: Preserve document contention report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: document-contention-cross-engine-${{ inputs.comparison_scale || 'smoke' }}
          path: ${{ runner.temp }}/document-contention-*/
          if-no-files-found: ignore
