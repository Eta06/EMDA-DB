name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust ${{ matrix.toolchain }} / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", "stable"]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Test release validation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check formatting
        run: |
          cargo +${{ matrix.toolchain }} fmt --all -- --check
          cargo +${{ matrix.toolchain }} fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Lint
        run: cargo +${{ matrix.toolchain }} clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --all-targets --locked
      - name: Test optimized build
        if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} test --release --all-targets --locked
      - name: Benchmark smoke tests
        if: matrix.toolchain == 'stable'
        run: |
          cargo +stable run --release --locked --example document_bench -- prototype "$RUNNER_TEMP" 5
          cargo +stable run --release --locked --example document_bench -- sqlite "$RUNNER_TEMP" 5
          cargo +stable build --release --locked --example online_reclaim_bench
          cargo +stable build --release --locked --example nonunique_query_bench
          python3 scripts/nonunique_query_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/nonunique_query_bench --output "$RUNNER_TEMP/nonunique-query-smoke.json" --cases 16:4 --rounds 2 --cycles 2
          cargo +stable build --release --locked --example membership_union_bench
          python3 scripts/nonunique_query_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/membership_union_bench --membership --output "$RUNNER_TEMP/membership-union-smoke.json" --cases 16:4 --rounds 2 --cycles 2
          cargo +stable build --release --locked --example aggregate_stats_bench
          python3 scripts/aggregate_stats_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/aggregate_stats_bench --output "$RUNNER_TEMP/aggregate-stats-smoke.json" --documents 16 --rounds 2 --cycles 2
          cargo +stable build --release --locked --example range_query_bench
          python3 scripts/nonunique_query_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/range_query_bench --index-name docs_number --output "$RUNNER_TEMP/range-query-smoke.json" --cases 16:4 --rounds 2 --cycles 2
          cargo +stable build --release --locked --example compound_query_bench
          python3 scripts/nonunique_query_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/compound_query_bench --index-name docs_pair --output "$RUNNER_TEMP/compound-query-smoke.json" --cases 16:4 --rounds 2 --cycles 2
          cargo +stable build --release --locked --example partial_query_bench
          python3 scripts/nonunique_query_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/partial_query_bench --index-name docs_partial --output "$RUNNER_TEMP/partial-query-smoke.json" --cases 16:4 --rounds 2 --cycles 2
          cargo +stable build --release --locked --example compound_range_query_bench
          python3 scripts/nonunique_query_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/compound_range_query_bench --index-name docs_tenant_number --output "$RUNNER_TEMP/compound-range-query-smoke.json" --cases 16:4 --rounds 2 --cycles 2
          python3 scripts/online_reclaim_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/online_reclaim_bench --output "$RUNNER_TEMP/online-reclaim-smoke.json" --keys 16 --rounds 2
          python3 scripts/document_scale_compare.py --compare-plans --directory "$RUNNER_TEMP" --binary target/release/examples/document_bench --baseline-binary target/release/examples/document_bench --output "$RUNNER_TEMP/document-planner-smoke.json" --sizes 5 --rounds 2 --cycles 3
          cargo +stable run --release --locked --example kv_bench -- prototype 2 20 16 50 "$RUNNER_TEMP"
          cargo +stable run --release --locked --example kv_bench -- prototype-key-byte-limit 2 20 16 50 "$RUNNER_TEMP"
          python3 scripts/key_byte_limit_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/key-byte-limit-smoke.json" --rounds 2 --operations 20 --baseline-binary target/release/examples/kv_bench --baseline-revision HEAD
          python3 scripts/key_byte_limit_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/log-limit-smoke.json" --rounds 2 --operations 20 --cap log --baseline-binary target/release/examples/kv_bench --baseline-revision HEAD
          cargo +stable run --release --locked --example kv_bench -- sqlite 2 20 16 50 "$RUNNER_TEMP"
          cargo +stable run --release --locked --example kv_bench -- prototype 2 20 16 50 "$RUNNER_TEMP" 4096
          cargo +stable run --release --locked --example kv_bench -- sqlite 2 20 16 50 "$RUNNER_TEMP" 4096
          cargo +stable run --release --locked --example contention_bench -- prototype 131072 2 2 20 "$RUNNER_TEMP"
          cargo +stable run --release --locked --example contention_bench -- sqlite 131072 2 2 20 "$RUNNER_TEMP"
          cargo +stable build --release --locked --example network_bench_server
          python3 scripts/network_compare.py prototype --server target/release/examples/network_bench_server --directory "$RUNNER_TEMP" --clients 2 --operations 20 --keys 16
          python3 scripts/network_compare.py sqlite --server target/release/examples/network_bench_server --directory "$RUNNER_TEMP" --clients 2 --operations 20 --keys 16
          python3 scripts/network_compare.py prototype --server target/release/examples/network_bench_server --directory "$RUNNER_TEMP" --clients 2 --operations 5 --keys 4 --workload crud
          python3 scripts/network_compare.py sqlite --server target/release/examples/network_bench_server --directory "$RUNNER_TEMP" --clients 2 --operations 5 --keys 4 --workload crud
          python3 scripts/network_compare.py sqlite_python --directory "$RUNNER_TEMP" --clients 2 --operations 5 --keys 4 --workload crud
          cargo +stable run --release --locked --example restore_drill -- "$RUNNER_TEMP" "$RUNNER_TEMP"
          cargo +stable run --release --locked --example recovery_bench -- prepare "$RUNNER_TEMP/recovery-smoke" 100
          cargo +stable run --release --locked --example recovery_bench -- measure "$RUNNER_TEMP/recovery-smoke" 100 3
          cargo +stable run --release --locked --example recovery_bench -- prepare "$RUNNER_TEMP/recovery-large-smoke" 10 131072
          cargo +stable run --release --locked --example recovery_bench -- measure "$RUNNER_TEMP/recovery-large-smoke" 10 3 131072
          cargo +stable run --release --locked --example checkpoint_bench -- "$RUNNER_TEMP" 32 8 2
          cargo +stable build --release --locked --example index_memory_bench
          python3 scripts/index_memory_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/index-memory-smoke.json" --rounds 2 --keys 32 --key-bytes 8 --tail-keys 4
          cargo +stable build --release --locked --example checkpoint_rollover_bench
          python3 scripts/checkpoint_rollover_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/checkpoint-rollover-smoke.json" --rounds 2 --keys 32 --key-bytes 8 --tail-keys 4
          python3 scripts/checkpoint_rollover_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/checkpoint-managed-rollover-smoke.json" --rounds 2 --keys 32 --key-bytes 8 --tail-keys 4 --managed
          cargo +stable build --release --locked --example backup_validation_bench
          python3 scripts/backup_validation_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/backup-validation-smoke.json" --rounds 2 --keys 32 --key-bytes 8 --tail-keys 4 --baseline-binary target/release/examples/backup_validation_bench --baseline-revision HEAD
          cargo +stable build --release --locked --example checkpoint_compaction_bench
          python3 scripts/checkpoint_compaction_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/checkpoint-compaction-smoke.json" --rounds 2 --keys 32 --key-bytes 8 --tail-keys 4
