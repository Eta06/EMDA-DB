name: CI

"on":
  push:
    branches: [main]
    # Archiving completed runs must not queue another benchmark run.
    paths-ignore:
      - "benchmarks/results/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let an active main run finish uploading its benchmark attempts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Rust ${{ matrix.toolchain }} / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", "stable"]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Test release validation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check formatting
        run: |
          cargo +${{ matrix.toolchain }} fmt --all -- --check
          cargo +${{ matrix.toolchain }} fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Lint
        run: cargo +${{ matrix.toolchain }} clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --all-targets --locked
      - name: Test optimized build
        if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} test --release --all-targets --locked
      - name: Benchmark smoke tests
        if: matrix.toolchain == 'stable'
        run: |
          source scripts/benchmarks/record_case.sh
          record_benchmark document-bench-prototype cargo +stable run --release --locked --example document_bench -- prototype "$RUNNER_TEMP" 5
          record_benchmark document-bench-sqlite cargo +stable run --release --locked --example document_bench -- sqlite "$RUNNER_TEMP" 5
          cargo +stable build --release --locked --example online_reclaim_bench
          cargo +stable build --release --locked --example nonunique_query_bench
          record_benchmark nonunique-query-smoke python3 scripts/nonunique_query_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/nonunique_query_bench --output "$RUNNER_TEMP/nonunique-query-smoke.json" --cases 16:4 --rounds 2 --cycles 2
          cargo +stable build --release --locked --example membership_union_bench
          record_benchmark membership-union-smoke python3 scripts/nonunique_query_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/membership_union_bench --membership --output "$RUNNER_TEMP/membership-union-smoke.json" --cases 16:4 --rounds 2 --cycles 2
          cargo +stable build --release --locked --example aggregate_stats_bench
          record_benchmark aggregate-stats-smoke python3 scripts/aggregate_stats_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/aggregate_stats_bench --output "$RUNNER_TEMP/aggregate-stats-smoke.json" --documents 16 --rounds 2 --cycles 2
          record_benchmark planned-aggregate-stats-smoke python3 scripts/aggregate_stats_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/aggregate_stats_bench --output "$RUNNER_TEMP/planned-aggregate-stats-smoke.json" --documents 64 --rounds 2 --cycles 2 --selective
          cargo +stable build --release --locked --example range_query_bench
          record_benchmark range-query-smoke python3 scripts/nonunique_query_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/range_query_bench --index-name docs_number --output "$RUNNER_TEMP/range-query-smoke.json" --cases 16:4 --rounds 2 --cycles 2
          cargo +stable build --release --locked --example compound_query_bench
          record_benchmark compound-query-smoke python3 scripts/nonunique_query_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/compound_query_bench --index-name docs_pair --output "$RUNNER_TEMP/compound-query-smoke.json" --cases 16:4 --rounds 2 --cycles 2
          cargo +stable build --release --locked --example compound_membership_bench
          record_benchmark compound-membership-smoke python3 scripts/nonunique_query_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/compound_membership_bench --index-name docs_pair --compound-membership --output "$RUNNER_TEMP/compound-membership-smoke.json" --cases 16:4 --rounds 2 --cycles 2
          cargo +stable build --release --locked --example partial_query_bench
          record_benchmark partial-query-smoke python3 scripts/nonunique_query_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/partial_query_bench --index-name docs_partial --output "$RUNNER_TEMP/partial-query-smoke.json" --cases 16:4 --rounds 2 --cycles 2
          cargo +stable build --release --locked --example compound_range_query_bench
          record_benchmark compound-range-query-smoke python3 scripts/nonunique_query_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/compound_range_query_bench --index-name docs_tenant_number --output "$RUNNER_TEMP/compound-range-query-smoke.json" --cases 16:4 --rounds 2 --cycles 2
          cargo +stable build --release --locked --example collection_drop_bench
          record_benchmark collection-drop-smoke python3 scripts/collection_drop_compare.py --directory "$RUNNER_TEMP" --before-binary target/release/examples/collection_drop_bench --after-binary target/release/examples/collection_drop_bench --output "$RUNNER_TEMP/collection-drop-smoke.json" --sizes 8 --rounds 2
          mkdir "$RUNNER_TEMP/drop-format-probe"
          record_benchmark drop-format-compat-probe-create cargo +stable run --release --locked --example drop_format_compat_probe -- create "$RUNNER_TEMP/drop-format-probe"
          record_benchmark drop-format-compat-probe-resume cargo +stable run --release --locked --example drop_format_compat_probe -- resume "$RUNNER_TEMP/drop-format-probe"
          record_benchmark online-reclaim-smoke python3 scripts/online_reclaim_compare.py --directory "$RUNNER_TEMP" --binary target/release/examples/online_reclaim_bench --output "$RUNNER_TEMP/online-reclaim-smoke.json" --keys 16 --rounds 2
          cargo +stable build --release --locked --example online_checkpoint_reclaim_bench
          for trial in 1 2 3; do
            record_benchmark "online-checkpoint-reclaim-$trial" /usr/bin/time -v target/release/examples/online_checkpoint_reclaim_bench "$RUNNER_TEMP" 200000
          done
          cargo +stable build --release --locked --example online_checkpoint_budget_bench
          for trial in 1 2 3; do
            record_benchmark "online-checkpoint-budget-$trial" /usr/bin/time -v target/release/examples/online_checkpoint_budget_bench "$RUNNER_TEMP" 200000
          done
          record_benchmark document-planner-smoke python3 scripts/document_scale_compare.py --compare-plans --directory "$RUNNER_TEMP" --binary target/release/examples/document_bench --baseline-binary target/release/examples/document_bench --output "$RUNNER_TEMP/document-planner-smoke.json" --sizes 5 --rounds 2 --cycles 3
          record_benchmark kv-bench-prototype-64b cargo +stable run --release --locked --example kv_bench -- prototype 2 20 16 50 "$RUNNER_TEMP"
          record_benchmark kv-bench-prototype-key-byte-limit-64b cargo +stable run --release --locked --example kv_bench -- prototype-key-byte-limit 2 20 16 50 "$RUNNER_TEMP"
          record_benchmark key-byte-limit-smoke python3 scripts/key_byte_limit_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/key-byte-limit-smoke.json" --rounds 2 --operations 20 --baseline-binary target/release/examples/kv_bench --baseline-revision HEAD
          record_benchmark log-limit-smoke python3 scripts/key_byte_limit_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/log-limit-smoke.json" --rounds 2 --operations 20 --cap log --baseline-binary target/release/examples/kv_bench --baseline-revision HEAD
          record_benchmark kv-bench-sqlite-64b cargo +stable run --release --locked --example kv_bench -- sqlite 2 20 16 50 "$RUNNER_TEMP"
          record_benchmark kv-bench-prototype-4k cargo +stable run --release --locked --example kv_bench -- prototype 2 20 16 50 "$RUNNER_TEMP" 4096
          record_benchmark kv-bench-sqlite-4k cargo +stable run --release --locked --example kv_bench -- sqlite 2 20 16 50 "$RUNNER_TEMP" 4096
          record_benchmark contention-bench-prototype cargo +stable run --release --locked --example contention_bench -- prototype 131072 2 2 20 "$RUNNER_TEMP"
          record_benchmark contention-bench-sqlite cargo +stable run --release --locked --example contention_bench -- sqlite 131072 2 2 20 "$RUNNER_TEMP"
          cargo +stable build --release --locked --example network_bench_server
          record_benchmark network-prototype-mixed python3 scripts/network_compare.py prototype --server target/release/examples/network_bench_server --directory "$RUNNER_TEMP" --clients 2 --operations 20 --keys 16
          record_benchmark network-sqlite-mixed python3 scripts/network_compare.py sqlite --server target/release/examples/network_bench_server --directory "$RUNNER_TEMP" --clients 2 --operations 20 --keys 16
          record_benchmark network-prototype-crud python3 scripts/network_compare.py prototype --server target/release/examples/network_bench_server --directory "$RUNNER_TEMP" --clients 2 --operations 5 --keys 4 --workload crud
          record_benchmark network-sqlite-crud python3 scripts/network_compare.py sqlite --server target/release/examples/network_bench_server --directory "$RUNNER_TEMP" --clients 2 --operations 5 --keys 4 --workload crud
          record_benchmark network-sqlite-python-crud python3 scripts/network_compare.py sqlite_python --directory "$RUNNER_TEMP" --clients 2 --operations 5 --keys 4 --workload crud
          record_benchmark restore-drill cargo +stable run --release --locked --example restore_drill -- "$RUNNER_TEMP" "$RUNNER_TEMP"
          record_benchmark recovery-bench-prepare cargo +stable run --release --locked --example recovery_bench -- prepare "$RUNNER_TEMP/recovery-smoke" 100
          record_benchmark recovery-bench-measure cargo +stable run --release --locked --example recovery_bench -- measure "$RUNNER_TEMP/recovery-smoke" 100 3
          record_benchmark recovery-bench-prepare-large cargo +stable run --release --locked --example recovery_bench -- prepare "$RUNNER_TEMP/recovery-large-smoke" 10 131072
          record_benchmark recovery-bench-measure-large cargo +stable run --release --locked --example recovery_bench -- measure "$RUNNER_TEMP/recovery-large-smoke" 10 3 131072
          record_benchmark checkpoint-bench cargo +stable run --release --locked --example checkpoint_bench -- "$RUNNER_TEMP" 32 8 2
          cargo +stable build --release --locked --example index_memory_bench
          record_benchmark index-memory-smoke python3 scripts/index_memory_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/index-memory-smoke.json" --rounds 2 --keys 32 --key-bytes 8 --tail-keys 4
          cargo +stable build --release --locked --example multi_store_resources
          record_benchmark multi-store-smoke python3 scripts/multi_store_resources.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/multi-store-smoke.json" --projects 1,3 --keys 8 --rounds 2
          record_benchmark multi-store-pair-smoke python3 scripts/multi_store_pair_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/multi-store-pair-smoke.json" --baseline-binary target/release/examples/multi_store_resources --candidate-binary target/release/examples/multi_store_resources --baseline-source . --candidate-source . --projects 3 --keys 8 --rounds 2
          cargo +stable build --release --locked --example restart_write_bench
          cargo +stable build --release --locked --example sqlite_restart_write_bench
          record_benchmark restart-write-smoke python3 scripts/restart_write_resources.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/restart-write-smoke.json" --keys 32 --key-bytes 8 --tail-keys 4 --workers 2 --writes 8 --epochs 2 --sqlite-binary target/release/examples/sqlite_restart_write_bench --evict-fixture-cache
          cargo +stable build --release --locked --example checkpoint_rollover_bench
          record_benchmark checkpoint-rollover-smoke python3 scripts/checkpoint_rollover_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/checkpoint-rollover-smoke.json" --rounds 2 --keys 32 --key-bytes 8 --tail-keys 4
          record_benchmark checkpoint-managed-rollover-smoke python3 scripts/checkpoint_rollover_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/checkpoint-managed-rollover-smoke.json" --rounds 2 --keys 32 --key-bytes 8 --tail-keys 4 --managed
          record_benchmark checkpoint-managed-pair-smoke python3 scripts/managed_rollover_before_after.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/checkpoint-managed-pair-smoke.json" --rounds 2 --keys 32 --key-bytes 8 --tail-keys 4 --baseline-binary target/release/examples/checkpoint_rollover_bench --baseline-revision HEAD --binary target/release/examples/checkpoint_rollover_bench --prepare-binary target/release/examples/index_memory_bench
          cargo +stable build --release --locked --example backup_validation_bench
          record_benchmark backup-validation-smoke python3 scripts/backup_validation_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/backup-validation-smoke.json" --rounds 2 --keys 32 --key-bytes 8 --tail-keys 4 --baseline-binary target/release/examples/backup_validation_bench --baseline-revision HEAD
          cargo +stable build --release --locked --example checkpoint_compaction_bench
          record_benchmark checkpoint-compaction-smoke python3 scripts/checkpoint_compaction_compare.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/checkpoint-compaction-smoke.json" --rounds 2 --keys 32 --key-bytes 8 --tail-keys 4
      - name: Preserve benchmark smoke attempts
        if: always() && matrix.toolchain == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-benchmark-smoke
          path: |
            ${{ runner.temp }}/benchmark-attempts/
            ${{ runner.temp }}/*-smoke.json
          if-no-files-found: ignore

  retained-memory-ceiling:
    name: Writable recovery / Linux memory ceiling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Verify million-key four-writer retained and checkpoint recovery and authorized restore under a 48 MiB address-space limit
        run: |
          source scripts/benchmarks/record_case.sh
          cargo +stable build --release --locked --example authorized_recovery_bench
          status=0
          record_benchmark writable-recovery-memory-ceiling python3 examples/authorized_recovery_bench.py target/release/examples/authorized_recovery_bench "$RUNNER_TEMP/writable-memory-workload" 1048576 4 --sqlite --wide-suffix --checkpoint --checkpoint-address-space-mib 48 --retained-address-space-mib 48 --writers 4 --retire-and-restore --authorized-restore || status=$?
          if [[ -d "$RUNNER_TEMP/writable-memory-workload" ]]; then
            find "$RUNNER_TEMP/writable-memory-workload" -maxdepth 1 -type f -exec cp {} "$RUNNER_TEMP/benchmark-attempts/writable-recovery-memory-ceiling/" \;
          fi
          if [[ "$status" != 0 ]]; then
            exit "$status"
          fi
          python3 - "$RUNNER_TEMP/writable-memory-workload/measurements.jsonl" <<'PY'
          import json
          import sys
          from pathlib import Path

          phases = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()]
          keys, operations, limit = 1_048_576, 32_768, 48 * 1024**2
          bounded = {"checkpoint", "retained"}
          backends = bounded | {"ordinary", "sqlite"}
          expected = {
              (backend, epoch, phase)
              for backend in backends
              for epoch in range(1, 5)
              for phase in ("mutate", "reopen", "verify")
          } | {
              ("all", 0, "setup"), ("checkpoint", 0, "checkpoint-setup"),
              ("retained", 0, "bind-archive"), ("retained", 0, "cutover"),
              ("retained", 4, "authorized-lifecycle"),
          }
          observed = {(row["backend"], row["epoch"], row["phase"]) for row in phases}
          if len(phases) != len(expected) or observed != expected:
              raise SystemExit("Missing, extra or duplicate recovery workload phase")
          for row in phases:
              backend, epoch, phase = row["backend"], row["epoch"], row["phase"]
              expected_limit = limit if backend in bounded and epoch else None
              if (row["keys"] != keys or row["exit"] != 0
                      or row["address_space_limit_bytes"] != expected_limit
                      or row["peak_rss_bytes"] <= 0
                      or (expected_limit is not None and row["peak_rss_bytes"] > expected_limit)):
                  raise SystemExit(f"Invalid recovery scope or memory coverage: {row}")
              if expected_limit is not None and (
                  row.get("rlimit_as_soft_bytes"), row.get("rlimit_as_hard_bytes")
              ) != (expected_limit, expected_limit):
                  raise SystemExit(f"Incorrect kernel address-space limits: {row}")
              if phase == "mutate" and (row["writers"], row["operations"]) != (4, operations):
                  raise SystemExit(f"Wrong write workload: {row}")
              # The epoch deletes IDs in [0, operations) congruent to -epoch modulo 11.
              live = keys - ((operations - 1 + epoch) // 11 - (epoch - 1) // 11)
              if phase == "verify" and row["verified_entries"] != live:
                  raise SystemExit(f"Incomplete ordered verification: {row}")
              if backend == "retained" and phase in ("mutate", "reopen", "verify"):
                  if (row.get("startup_scan_limit_bytes"), row.get("maintenance_scan_limit_bytes")) != (
                      432 * 1024**2, 1120 * 1024**2
                  ):
                      raise SystemExit(f"Expected bounded retained startup and maintenance: {row}")
              if phase == "authorized-lifecycle":
                  if row["restored_verified_entries"] != live or row["source_verified_entries"] != live:
                      raise SystemExit("Expected complete restored and source verification under the ceiling")
                  recovery_scan = 140 * 1024**2  # 128 MiB base + 12 MiB suffix
                  # Retirement verifies both retained copies, the log and both 36-byte witnesses.
                  archive_scan = 2 * recovery_scan + row["retired_log_bytes"] + 72
                  if (row["lifecycle_recovery_scan_limit_bytes"] != recovery_scan
                          or row["backup_restore_scan_limit_bytes"] != 2 * recovery_scan
                          or row["archive_retirement_scan_limit_bytes"] != archive_scan):
                      raise SystemExit("Expected logical copy, registration and archive scan ceilings")
          if not any(row["backend"] == "retained" and row["phase"] == "mutate"
                     and row.get("rotations", 0) > 0 for row in phases):
              raise SystemExit("Expected a retained rotation under the ceiling")
          if not any(row["backend"] == "checkpoint" and row["phase"] == "mutate"
                     and row.get("checkpoint_advanced", 0) > 0 for row in phases):
              raise SystemExit("Expected a checkpoint rollover under the ceiling")
          PY
      - name: Preserve the workload attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: writable-recovery-memory-ceiling
          path: ${{ runner.temp }}/benchmark-attempts/writable-recovery-memory-ceiling/
          if-no-files-found: ignore
