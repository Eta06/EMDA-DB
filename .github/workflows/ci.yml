name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust ${{ matrix.toolchain }} / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", "stable"]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Test release validation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check formatting
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: Lint
        run: cargo +${{ matrix.toolchain }} clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --all-targets --locked
      - name: Test optimized build
        if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} test --release --all-targets --locked
      - name: Benchmark smoke tests
        if: matrix.toolchain == 'stable'
        run: |
          cargo +stable run --release --locked --example kv_bench -- prototype 2 20 16 50 "$RUNNER_TEMP"
          cargo +stable run --release --locked --example kv_bench -- sqlite 2 20 16 50 "$RUNNER_TEMP"
          cargo +stable run --release --locked --example kv_bench -- prototype 2 20 16 50 "$RUNNER_TEMP" 4096
          cargo +stable run --release --locked --example kv_bench -- sqlite 2 20 16 50 "$RUNNER_TEMP" 4096
          cargo +stable run --release --locked --example contention_bench -- prototype 131072 2 2 20 "$RUNNER_TEMP"
          cargo +stable run --release --locked --example contention_bench -- sqlite 131072 2 2 20 "$RUNNER_TEMP"
          cargo +stable build --release --locked --example network_bench_server
          python3 scripts/network_compare.py prototype --server target/release/examples/network_bench_server --directory "$RUNNER_TEMP" --clients 2 --operations 20 --keys 16
          python3 scripts/network_compare.py sqlite --server target/release/examples/network_bench_server --directory "$RUNNER_TEMP" --clients 2 --operations 20 --keys 16
          cargo +stable run --release --locked --example restore_drill -- "$RUNNER_TEMP" "$RUNNER_TEMP"
          cargo +stable run --release --locked --example recovery_bench -- prepare "$RUNNER_TEMP/recovery-smoke" 100
          cargo +stable run --release --locked --example recovery_bench -- measure "$RUNNER_TEMP/recovery-smoke" 100 3
          cargo +stable run --release --locked --example recovery_bench -- prepare "$RUNNER_TEMP/recovery-large-smoke" 10 131072
          cargo +stable run --release --locked --example recovery_bench -- measure "$RUNNER_TEMP/recovery-large-smoke" 10 3 131072
