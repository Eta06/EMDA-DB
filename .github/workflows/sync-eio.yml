name: Filesystem EIO checks

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-eio.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "tests/fixtures/**"
      - "examples/sync_failure_probe.rs"
      - "examples/concurrent_eio_probe.rs"
      - "scripts/sync_eio_campaign.py"
      - "scripts/double_eio_campaign.py"
      - "scripts/concurrent_eio_campaign.py"
      - "scripts/tests/test_sync_eio_campaign.py"
      - "scripts/tests/test_double_eio_campaign.py"
      - "scripts/tests/test_concurrent_eio_campaign.py"
  pull_request:
    paths:
      - ".github/workflows/sync-eio.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "tests/fixtures/**"
      - "examples/sync_failure_probe.rs"
      - "examples/concurrent_eio_probe.rs"
      - "scripts/sync_eio_campaign.py"
      - "scripts/double_eio_campaign.py"
      - "scripts/concurrent_eio_campaign.py"
      - "scripts/tests/test_sync_eio_campaign.py"
      - "scripts/tests/test_double_eio_campaign.py"
      - "scripts/tests/test_concurrent_eio_campaign.py"

permissions:
  contents: read

jobs:
  sync-eio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust and strace
        run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update
          sudo apt-get install -y strace
      - name: Build and inject filesystem failures
        run: |
          cargo +stable build --release --locked --example sync_failure_probe --example concurrent_eio_probe
          python3 scripts/sync_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/sync-eio-result.json"
          python3 scripts/sync_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/sync-eio-persistent.json" --persistent-errors
          for syscall_group in data read open namespace; do
            python3 scripts/sync_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/eio-$syscall_group.json" --syscall-set "$syscall_group"
          done
          python3 scripts/double_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/eio-double.json"
          python3 scripts/double_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/eio-double-sync.json" --primary-mode sync --operation checkpoint-compaction --format v3
          python3 scripts/concurrent_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/eio-concurrent.json"
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: filesystem-eio-results
          path: |
            ${{ runner.temp }}/sync-eio-result.json
            ${{ runner.temp }}/sync-eio-persistent.json
            ${{ runner.temp }}/eio-data.json
            ${{ runner.temp }}/eio-read.json
            ${{ runner.temp }}/eio-open.json
            ${{ runner.temp }}/eio-namespace.json
            ${{ runner.temp }}/eio-double.json
            ${{ runner.temp }}/eio-double-sync.json
            ${{ runner.temp }}/eio-concurrent.json
          if-no-files-found: ignore
