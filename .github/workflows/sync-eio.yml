name: Synchronization EIO checks

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-eio.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "tests/fixtures/**"
      - "examples/sync_failure_probe.rs"
      - "scripts/sync_eio_campaign.py"
      - "scripts/tests/test_sync_eio_campaign.py"
  pull_request:
    paths:
      - ".github/workflows/sync-eio.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "tests/fixtures/**"
      - "examples/sync_failure_probe.rs"
      - "scripts/sync_eio_campaign.py"
      - "scripts/tests/test_sync_eio_campaign.py"

permissions:
  contents: read

jobs:
  sync-eio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust and strace
        run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update
          sudo apt-get install -y strace
      - name: Build and inject sync failures
        run: |
          cargo +stable build --release --locked --example sync_failure_probe
          python3 scripts/sync_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/sync-eio-result.json"
          python3 scripts/sync_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/sync-eio-persistent.json" --persistent-errors
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synchronization-eio-result
          path: |
            ${{ runner.temp }}/sync-eio-result.json
            ${{ runner.temp }}/sync-eio-persistent.json
          if-no-files-found: ignore
