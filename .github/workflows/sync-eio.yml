name: Filesystem EIO checks

"on":
  workflow_dispatch:
    inputs:
      full_eintr:
        description: Run the full interrupted-call campaign instead of the standard EIO suite
        type: boolean
        default: false
        required: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-eio.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "tests/fixtures/**"
      - "examples/sync_failure_probe.rs"
      - "examples/concurrent_eio_probe.rs"
      - "scripts/sync_eio_campaign.py"
      - "scripts/double_eio_campaign.py"
      - "scripts/verify_double_eio_results.py"
      - "scripts/verify_one_shot_fs_results.py"
      - "scripts/concurrent_eio_campaign.py"
      - "scripts/witness_retry_faults.py"
      - "scripts/tests/test_sync_eio_campaign.py"
      - "scripts/tests/test_double_eio_campaign.py"
      - "scripts/tests/test_verify_double_eio_results.py"
      - "scripts/tests/test_verify_one_shot_fs_results.py"
      - "scripts/tests/test_concurrent_eio_campaign.py"
      - "scripts/tests/test_witness_retry_faults.py"
  pull_request:
    paths:
      - ".github/workflows/sync-eio.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "tests/fixtures/**"
      - "examples/sync_failure_probe.rs"
      - "examples/concurrent_eio_probe.rs"
      - "scripts/sync_eio_campaign.py"
      - "scripts/double_eio_campaign.py"
      - "scripts/verify_double_eio_results.py"
      - "scripts/verify_one_shot_fs_results.py"
      - "scripts/concurrent_eio_campaign.py"
      - "scripts/witness_retry_faults.py"
      - "scripts/tests/test_sync_eio_campaign.py"
      - "scripts/tests/test_double_eio_campaign.py"
      - "scripts/tests/test_verify_double_eio_results.py"
      - "scripts/tests/test_verify_one_shot_fs_results.py"
      - "scripts/tests/test_concurrent_eio_campaign.py"
      - "scripts/tests/test_witness_retry_faults.py"

permissions:
  contents: read

jobs:
  sync-eio:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_eintr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust and strace
        run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update
          sudo apt-get install -y strace
      - name: Build and inject filesystem failures
        run: |
          cargo +stable build --release --locked --example sync_failure_probe --example concurrent_eio_probe
          python3 scripts/sync_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/sync-eio-result.json"
          python3 scripts/verify_one_shot_fs_results.py "$RUNNER_TEMP/sync-eio-result.json"
          python3 scripts/sync_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/sync-eio-persistent.json" --persistent-errors
          for syscall_group in data read open namespace; do
            python3 scripts/sync_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/eio-$syscall_group.json" --syscall-set "$syscall_group"
            python3 scripts/verify_one_shot_fs_results.py "$RUNNER_TEMP/eio-$syscall_group.json"
          done
          python3 scripts/sync_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/eintr-sync.json" --error EINTR --operation batch --format v3 --max-ordinals 2
          python3 scripts/verify_one_shot_fs_results.py "$RUNNER_TEMP/eintr-sync.json"
          python3 scripts/sync_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/eintr-data.json" --error EINTR --syscall-set data --operation batch --format v3 --max-ordinals 2
          python3 scripts/verify_one_shot_fs_results.py "$RUNNER_TEMP/eintr-data.json"
          python3 scripts/double_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/eio-double.json"
          python3 scripts/verify_double_eio_results.py "$RUNNER_TEMP/eio-double.json"
          python3 scripts/double_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/eio-double-sync.json" --primary-mode sync --all-sync-paths --operation checkpoint-compaction --format v3
          python3 scripts/verify_double_eio_results.py "$RUNNER_TEMP/eio-double-sync.json"
          python3 scripts/concurrent_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/eio-concurrent.json"
          python3 scripts/concurrent_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/eintr-concurrent.json" --error EINTR --repetitions 1
          python3 scripts/witness_retry_faults.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/witness-retry.json"
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: filesystem-eio-results
          path: |
            ${{ runner.temp }}/sync-eio-result.json
            ${{ runner.temp }}/sync-eio-persistent.json
            ${{ runner.temp }}/eio-data.json
            ${{ runner.temp }}/eio-read.json
            ${{ runner.temp }}/eio-open.json
            ${{ runner.temp }}/eio-namespace.json
            ${{ runner.temp }}/eintr-sync.json
            ${{ runner.temp }}/eintr-data.json
            ${{ runner.temp }}/eio-double.json
            ${{ runner.temp }}/eio-double.json.progress.json
            ${{ runner.temp }}/eio-double-sync.json
            ${{ runner.temp }}/eio-double-sync.json.progress.json
            ${{ runner.temp }}/eio-concurrent.json
            ${{ runner.temp }}/eintr-concurrent.json
            ${{ runner.temp }}/witness-retry.json
          if-no-files-found: ignore
  interrupted-calls:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_eintr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust and strace
        run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update
          sudo apt-get install -y strace
      - name: Exercise interrupted calls
        run: |
          cargo +stable build --release --locked --example sync_failure_probe
          failed=0
          for syscall_group in sync data read open namespace; do
            if ! python3 scripts/sync_eio_campaign.py --directory "$RUNNER_TEMP" --output "$RUNNER_TEMP/eintr-full-$syscall_group.json" --error EINTR --syscall-set "$syscall_group"; then
              failed=1
            elif ! python3 scripts/verify_one_shot_fs_results.py "$RUNNER_TEMP/eintr-full-$syscall_group.json"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Preserve interrupted-call results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interrupted-call-results
          path: ${{ runner.temp }}/eintr-full-*.json
          if-no-files-found: ignore
